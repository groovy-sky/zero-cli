[package]
name = "wasm-shell-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wasm-shell-mcp"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "43.0.0", default-features = false, features = ["cranelift", "runtime"] }
wasmtime-wasi = { version = "43.0.0", features = ["p1"] }
tokio = { version = "1.50.0", features = ["full"] }
anyhow = "1.0.102"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Patch iana-time-zone to avoid CoreFoundation so we can cross-compile from
# Linux to macOS without needing the Apple SDK.  The stub reads /etc/localtime
# which works correctly on both Linux and macOS.
[patch.crates-io]
iana-time-zone = { path = "vendor/iana-time-zone-stub" }
