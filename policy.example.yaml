# Minimal policy for zero-cli

fs:
  # Host path to mount into the WASM guest.
  # The guest will see this directory at fs.workspace_guest.
  workspace_host: "."
  workspace_guest: "/sandbox"

net:
  # When false, http_fetch is unavailable (guest cannot do network).
  enabled: true

  # URL prefix allowlist for http_fetch.
  # Any requested URL must start with one of these prefixes.
  http_allow:
    - "https://api.github.com/"
    - "https://pypi.org/"

limits:
  # Hard timeout for a single module run.
  timeout_ms: 30000

  # Best-effort memory limit in MiB (wazero store limit).
  # Note: exact enforcement depends on runtime behavior and module allocations.
  max_memory_mb: 128